# =========================================================
# cs.ave-mujica.top / ave-mujica.top
# 安全加固版（2026-10-30）
# =========================================================

server_tokens off;

# CORS：仅允许同源前端（默认不输出任何 CORS 头）
map $http_origin $cs_cors_origin {
    default "";
    "~^https://cs\.ave-mujica\.top$" $http_origin;
}

# 认证入口限流：每 IP 每分钟 10 次
limit_req_zone $binary_remote_addr zone=cs_auth_init:10m rate=20r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 308 https://ave-mujica.top$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.ave-mujica.top;

    ssl_certificate /etc/nginx/tls/current/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/current/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HomepageTLS:1m;
    ssl_session_timeout 10m;

    return 308 https://ave-mujica.top$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name cs.ave-mujica.top;

    return 308 https://cs.ave-mujica.top$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cs.ave-mujica.top;

    ssl_certificate /etc/nginx/tls/current/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/current/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HomepageTLS:1m;
    ssl_session_timeout 10m;

    # ---------- 统一安全响应头 ----------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---------- 阻断版本控制目录与敏感文件 ----------
    location ~ /\.(git|svn|hg|bzr)(/|$) {
        return 404;
    }
    location ~ /\.(env|DS_Store|htaccess|htpasswd)$ {
        return 404;
    }
    location ~* \.(bak|old|orig|swp|sql|log)$ {
        return 404;
    }

    # ---------- 关闭自动生成的 API 文档 ----------
    location = /api/openapi.json { return 404; }
    location = /api/docs           { return 404; }
    location = /api/redoc          { return 404; }

    # ---------- 管理接口不对公网开放 ----------
    location = /api/mod/mute { return 403; }

    # ---------- 认证入口限流 ----------
    location = /api/auth/init {
        limit_req zone=cs_auth_init burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @cs_rate_limited;

        proxy_pass http://host.docker.internal:8888;
        proxy_buffering off;
        proxy_read_timeout 660s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;
    }

    # 限流返回 JSON，便于前端解析
    location @cs_rate_limited {
        default_type application/json;
        return 429 '{"detail":"请求过于频繁，请稍后再试"}';
    }

    location /api/ {
        proxy_pass http://host.docker.internal:8888;
        proxy_buffering off;
        proxy_read_timeout 660s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 剥离后端反射的 CORS 头：前端与接口同源，无需 CORS，
        # 同时杜绝任意 Origin 反射导致的跨站读取。
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;
    }

    location /imgs/ {
        alias /usr/share/nginx/imgs/;
        autoindex on;
        expires 30d;
    }

    location / {
        root /usr/share/nginx/dashboard;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # HTML 不缓存（此处重复安全头，避免 add_header 继承被覆盖）
    location ~* \.html?$ {
        root /usr/share/nginx/dashboard;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name ave-mujica.top;

    ssl_certificate /etc/nginx/tls/current/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/current/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HomepageTLS:1m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
