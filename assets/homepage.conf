server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 308 https://ave-mujica.top$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.ave-mujica.top;

    ssl_certificate /etc/nginx/tls/current/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/current/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HomepageTLS:1m;
    ssl_session_timeout 10m;

    return 308 https://ave-mujica.top$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name cs.ave-mujica.top;

    return 308 https://cs.ave-mujica.top$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cs.ave-mujica.top;

    ssl_certificate /etc/nginx/tls/current/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/current/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HomepageTLS:1m;
    ssl_session_timeout 10m;

    location /api/ {
        proxy_pass http://host.docker.internal:8888;
        proxy_buffering off;
        proxy_read_timeout 660s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /imgs/ {
        alias /usr/share/nginx/imgs/;
        autoindex on;
        expires 30d;
    }

    location / {
        root /usr/share/nginx/dashboard;
        index index.html;
        try_files $uri $uri/ /index.html;
        if ($request_filename ~* .*\.(?:htm|html)$) {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name ave-mujica.top;

    ssl_certificate /etc/nginx/tls/current/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/current/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HomepageTLS:1m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
