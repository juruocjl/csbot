server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Docker DNS refreshes the GitHub Pages address without a container restart.
    resolver 127.0.0.11 valid=300s ipv6=off;
    resolver_timeout 5s;
    set $homepage_host juruocjl.github.io;

    location / {
        proxy_pass https://$homepage_host$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $homepage_host;
        proxy_set_header Connection "";
        # The public homepage does not need credentials from other local services.
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";

        proxy_ssl_server_name on;
        proxy_ssl_name $homepage_host;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_redirect https://juruocjl.github.io/ /;
        proxy_hide_header Strict-Transport-Security;
    }
}
