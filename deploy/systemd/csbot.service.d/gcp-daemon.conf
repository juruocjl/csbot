[Unit]
# Route CSBot AI turns through the resident DSH daemon on GCP.
Requires=csbot-dsh.service
After=csbot-dsh.service
Wants=csbot-dsh.service

[Service]
Environment=CS_AI_DSH_MODE=daemon
Environment=CS_AI_DSH_DAEMON_URL=http://127.0.0.1:32151
Environment=CS_AI_DSH_DAEMON_TOKEN_FILE=/var/lib/csbot-dsh/bridge-token
# Read after .env.prod so the GCP host never inherits the old :7890 proxy.
EnvironmentFile=-/home/ubuntu/csbot/deploy/gcp-direct.env
