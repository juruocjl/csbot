[Service]
# Install with scripts/install_ai_runtime.sh; keep the existing uv entrypoint.
Environment="PATH=/home/ubuntu/csbot/.tools/node/bin:/home/ubuntu/.local/bin:/usr/local/bin:/usr/bin:/bin"
Environment="CS_AI_STATE_DIR=/home/ubuntu/csbot/data/ai"
Environment="CS_AI_GAME_DB=/home/ubuntu/steam_monitor_js/data/friend_game_history.db"
Environment="CS_IMAGE_FULL_BUDGET_BYTES=1073741824"
# The trusted backend may contact Docker. Untrusted scripts never see its socket.
SupplementaryGroups=docker
# Cleanup only after the backend has stopped; do not race an active invocation.
ExecStartPre=/home/ubuntu/csbot/.venv/bin/python scripts/ai_preflight.py --cleanup-sandboxes
ExecStartPre=/home/ubuntu/csbot/.venv/bin/python scripts/ai_preflight.py --env .env --env .env.prod --allow-monitor-unready
ExecStopPost=/home/ubuntu/csbot/.venv/bin/python scripts/ai_preflight.py --cleanup-sandboxes
